[project]
name = "chesspuzzle-components"
version = "0.1.0"
description = "Streamlit Components v2 for globally loaded browser components"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"streamlit>=1.40.0",
	"zstandard>=0.23.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chess_components = ["assets/*.js"]
